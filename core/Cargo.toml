[package]
name = "chimera_core"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Chimera domain-pure foundation: config, constants, error, retry, utils. No web frameworks in the default build."

[dependencies]
anyhow = { workspace = true }
parking_lot = "0.12"
prometheus = "0.14.0"
config = { workspace = true }
hex = "0.4"
sha2 = "0.10"
chrono = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
solana-sdk = "3"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
urlencoding = "2.1"
axum = { workspace = true, optional = true }

[features]
# The axum HTTP-error response impl is isolated behind this feature so core
# stays web-framework-free when built without it (blueprint law 4).
api = ["dep:axum"]
test-utils = []

[dev-dependencies]

# NOTE (pragmatic exception, see docs/architecture/rust-workspace.md):
# `sqlx`/`config` appear as regular deps solely because AppError (the
# crate-wide error type) wraps sqlx::Error and config::ConfigError variants,
# and config.rs embeds solana_sdk pubkey validation. A future phase splits
# CoreError from InfraError to remove them.
