[package]
name = "chimera_infra"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Chimera adapters: Postgres backend implementing the core repository traits, external API clients. Depends on core; core never depends on this crate."

[dependencies]
chimera_core = { path = "../core" }
aes-gcm = "0.10"
anyhow = { workspace = true }
base64 = "0.22"
bs58 = "0.5"
getrandom = "0.2"
hex = "0.4"
dashmap = "6"
rand = { workspace = true }
zeroize = { version = "1.7", features = ["derive"] }
async-trait = { workspace = true }
chrono = { workspace = true }
parking_lot = "0.12"
prometheus = "0.14.0"
lru = "0.13"
reqwest = { workspace = true }
rust_decimal_macros = { workspace = true }
solana-client = "3"
solana-sdk = "3"
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"
tracing = { workspace = true }
uuid = { workspace = true }
redis = { version = "0.25", features = ["tokio-comp", "connection-manager", "aio"], optional = true }

[features]
redis-cache = ["dep:redis"]
