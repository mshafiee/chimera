[package]
name = "chimera_infra"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Chimera adapters: Postgres backend implementing the core repository traits, external API clients. Depends on core; core never depends on this crate."

[dependencies]
chimera_core = { path = "../core" }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
parking_lot = "0.12"
prometheus = "0.14.0"
lru = "0.13"
reqwest = { workspace = true }
solana-client = "3"
solana-sdk = "3"
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
redis = { version = "0.25", features = ["tokio-comp", "connection-manager", "aio"], optional = true }

[features]
redis-cache = ["dep:redis"]
