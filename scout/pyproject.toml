[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chimera-scout"
version = "1.0.1"
description = "Chimera Wallet Intelligence Layer"
requires-python = ">=3.11"
# Note: requirements.txt is the authoritative dependency source for the
# container build; these dependencies mirror the core runtime requirements
# for `pip install .`.
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "solana>=0.30.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.2.0",
    "networkx>=2.8",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Ignore common warnings for existing codebase
ignore = ["E501", "W293", "I001"]
