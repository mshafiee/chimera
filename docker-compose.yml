services:
  # PostgreSQL - Production Database (mainnet-paper and mainnet-prod profiles)
  postgres:
    image: postgres:15-alpine
    container_name: chimera-postgres
    restart: unless-stopped
    # Localhost-only binding (security, 2026-08-07): the DB must never be
    # reachable from the internet. External tools connect via
    # `docker compose exec` or an ssh tunnel. UFW additionally denies 5432.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      # Database credentials
      - POSTGRES_USER=${POSTGRES_USER:-chimera}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme_asap}
      - POSTGRES_DB=${POSTGRES_DB:-chimera}
      # Performance tuning — tuned down for 31GB host to prevent OOM backend kills
      # (observed: OOM killer killing postgres backends every 30-90min, taking
      # down all DB connections; 4GB shared_buffers + 200 conns × 64MB work_mem
      # could balloon to >12GB of preallocated memory)
      - POSTGRES_INITDB_ARGS=-E UTF8 --locale=C
      - POSTGRES_SHARED_BUFFERS=2GB
      - POSTGRES_EFFECTIVE_CACHE_SIZE=16GB
      - POSTGRES_MAINTENANCE_WORK_MEM=256MB
      - POSTGRES_WORK_MEM=32MB
      - POSTGRES_MAX_CONNECTIONS=50
      # WAL configuration for backup/recovery
      - POSTGRES_WAL_LEVEL=replica
      - POSTGRES_MAX_WAL_SENDERS=3
      - POSTGRES_WAL_KEEP_SIZE=256MB
    volumes:
       # Data persistence
       - postgres-data:/var/lib/postgresql/data
       # Initialization scripts (using generated schema)
       - ./operator/migrations_postgres/0001_full_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
       - ./scout/schema_scout_tables.sql:/docker-entrypoint-initdb.d/02-scout-tables.sql:ro
       # Custom pg_hba.conf (trust auth within Docker network)
       - ./docker/postgres/pg_hba.conf:/var/lib/postgresql/pg_hba.conf:ro
       # Backup scripts
       - ./ops/backup-postgres.sh:/usr/local/bin/backup-postgres.sh:ro
    command:
      - "postgres"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=16GB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=3"
      - "-c"
      - "wal_keep_size=256MB"
      - "-c"
      # log_statement=all floods docker logs (924K lines/10min measured) with
      # every sqlx query + parameters, generates heavy I/O that spiked page
      # cache toward the mem_limit, and leaks sensitive trade data to logs.
      - "log_statement=none"
      - "-c"
      - "hba_file=/var/lib/postgresql/pg_hba.conf"
      - "-c"
      - "log_destination=stderr"
      - "-c"
      - "log_line_prefix='%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chimera} -d ${POSTGRES_DB:-chimera}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Hard memory cap — prevents unbounded growth that triggered host OOM
    # backend kills (observed killing postgres processes every 30-90 min).
    # Real RSS is ~1.3GB; 24g leaves headroom for transient page-cache spikes.
    mem_limit: 24g
    networks:
      - chimera-network
    profiles:
      - mainnet-paper
      - mainnet-prod
      - evaluation

  # Redis - Unified cache for security services and application caching
  redis:
    image: redis:7-alpine
    container_name: chimera-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command:
      - "redis-server"
      - "--appendonly yes"                    # AOF persistence
      - "--appendfsync everysec"              # Flush every second
      - "--maxmemory 512mb"                   # Memory limit
      - "--maxmemory-policy allkeys-lru"      # Eviction policy
      - "--save 900 1"                         # RDB snapshot: 1 change in 900s
      - "--save 300 10"                        # RDB snapshot: 10 changes in 300s
      - "--save 60 10000"                      # RDB snapshot: 10k changes in 60s
      - "--dir /data"                          # Data directory
    volumes:
      - redis-data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - chimera-network
    profiles:
      - mainnet-paper
      - mainnet-prod
      - evaluation

  # Chimera Operator - Core trading engine
  operator:
    build:
      context: .
      dockerfile: operator/Dockerfile
      args:
        # Stamp the real git commit hash into the binary so decision_records /
        # promotion_episodes carry an accurate code_revision. Resolve from the
        # host env at build time; falls back to "unknown" (build.rs handles it).
        GIT_HASH: ${GIT_HASH:-unknown}
    container_name: chimera-operator
    restart: unless-stopped
    ports:
      - "8080:8080"
    expose:
      - "8080"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    environment:
       - RUST_LOG=info,chimera_operator=debug
       # Logs go to the host-mounted ./data volume (never inside the container layer)
       - CHIMERA_LOG_DIR=/app/data/logs
       - CHIMERA_SERVER__HOST=0.0.0.0
       - CHIMERA_SERVER__PORT=8080
       # Database backend selection (PostgreSQL-only)
       - CHIMERA_DB_MODE=${CHIMERA_DB_MODE:-postgres}
       - DATABASE_URL=${DATABASE_URL:-postgresql://chimera:changeme_asap@postgres:5432/chimera}
       # Redis configuration
       - REDIS_ENABLED=${REDIS_ENABLED:-true}
       - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
       - CHIMERA_JUPITER__API_KEY=${JUPITER_API_KEY:-}
       # Helius API key (config crate reads CHIMERA_ prefix, not raw HELIUS_API_KEY)
       - CHIMERA_MONITORING__HELIUS_API_KEY=${HELIUS_API_KEY}
       # RPC endpoints: use Helius RPC (reliable from this network) instead of
       # the public Solana RPC, which has proven unreachable here (DNS rotates
       # to IPs that time out, taking the health check down -> HAProxy 503).
       # RPC endpoints. Set CHIMERA_RPC__FALLBACK_URL to a DIFFERENT provider
       # (e.g. a second Helius project, or Quicknode/Triton) so a single-provider
       # quota exhaustion can't take down both RPC and signal ingress. Today both
       # default to the same Helius key — one quota event halts all trading.
       - "CHIMERA_RPC__PRIMARY_URL=${CHIMERA_RPC__PRIMARY_URL:-https://mainnet.helius-rpc.com/?api-key=${HELIUS_API_KEY}}"
       - "CHIMERA_RPC__FALLBACK_URL=${CHIMERA_RPC__FALLBACK_URL:-https://mainnet.helius-rpc.com/?api-key=${HELIUS_API_KEY}}"
       # Minimum WQS for signal admission
       - CHIMERA_SELECTION__MIN_WQS_SCORE=15.0
       # WQS trial admission (2026-08-23): sub-floor wallets with WQS >= 10
       # enter at spear-lite micro size (capped below) instead of hard
       # rejection. Evidence: 12h prod comparison found 10/10 shadow
       # mirror_main wins (+5.21% avg, +0.52 SOL) on WQS-10.0 rejects — the
       # documented star-copy-target profile stuck waiting for deduped-shadow
       # waiver evidence. Layered safety: spear-lite caps size AND the
       # consensus-or-proven gate still blocks solo entries.
       # REVERT if realized (post-cost) PnL of WQS-trial positions is
       # negative over 48h; tag trial decisions via the
       # "WQS floor trial admission" log marker.
       - CHIMERA_SELECTION__WQS_TRIAL_ENABLED=true
       - CHIMERA_SELECTION__WQS_TRIAL_MIN_SCORE=10.0
       # Token-age trial admission (2026-08-27, DARK→LIVE): SHIELD BUYs on
       # tokens in the [proven-floor(6min), global-min(15min)) band admit at
       # this micro cap instead of hard-rejecting TOKEN_TOO_NEW. Evidence
       # (shadow mirror_main, whale's round trip under our exit rails):
       # 72h leak +2.74 SOL pre-deploy; post-deploy 4 exits avg +19.5%.
       # Zero-mirror-sample fresh tokens complete via entry-confirmation
       # price-hold (bypass path). Downstream gates unchanged. REVERT if
       # realized net PnL of trial-size positions is negative over ~50
       # signals; tag via "Token-age TRIAL admission" log marker.
       - CHIMERA_SELECTION__TOKEN_AGE_TRIAL_ENABLED=true
       - CHIMERA_SELECTION__TOKEN_AGE_TRIAL_MAX_SIZE_SOL=0.25
       # Recency-weighted proven overlay (2026-08-24): after any proven path
       # passes, the wallet's last 10 closed copy-trades must not be net-
       # negative. ArcebCcX kept solo-admitting on a positive all-time ledger
       # while its trailing week ran -0.24 SOL — long-window aggregates go
       # stale silently. Set to 0 to restore aggregate-only checks.
       - CHIMERA_SELECTION__PROVEN_RECENCY_TRADES=10
       # Position cap for low-WQS wallets (WQS < 40 → max 0.25 SOL = min_size_sol)
       - CHIMERA_SELECTION__SPEAR_LITE_MAX_SIZE_SOL=0.25
       - CHIMERA_SELECTION__SPEAR_LITE_WQS_THRESHOLD=40.0
       # Profitability gate (2026-08-06): BUY requires consensus (≥2 wallets)
       # OR a wallet with >=5 closed copy-trades and positive 30d copy PnL
       # (lowered from 10 on 2026-08-22: proven-positive wallets like ArcebC
       # at 8 closed trades were stuck in the consensus wait — the 33-310s
       # entry lag behind the measured execution gap).
       # Single-wallet signals from unproven wallets were the negative-EV class.
       - CHIMERA_SELECTION__REQUIRE_CONSENSUS_OR_PROVEN=true
       - CHIMERA_SELECTION__MIN_PROVEN_TRADES=5
       - CHIMERA_SELECTION__REQUIRE_PROVEN_POSITIVE_PNL=true
       # Entry confirmation (2026-08-06): single-wallet unproven BUYs are
       # deferred and admitted only if the whale's entry price holds within
       # the drawdown tolerance for the wait window — stops buying the top of
       # fresh pumps (the pattern behind all 134 historical losing trades).
       # Recalibrated 2026-08-21 (entry-gap investigation): WAIT_SECS 300 -> 30.
       # The 3% max-drawdown check only filters DUMPS (a run-up never draws
       # down), so 300s added a ~5-min fill lag buying pump tops with zero
       # extra protection — measured 3.4-min mean whale->fill lag, 14% of
       # entries >5% above the whale, one loser at +14.5%. 30s keeps instant-
       # rug filtering; the adaptive stop/recovery gates cover the rest.
       - CHIMERA_ENTRY_CONFIRMATION__ENABLED=true
       - CHIMERA_ENTRY_CONFIRMATION__WAIT_SECS=30
       - CHIMERA_ENTRY_CONFIRMATION__MAX_DRAWDOWN_PCT=3.0
       # Shadow-mirror token gate (2026-08-06): admit only tokens whose whale
       # round-trips (mirror_main shadow avg) clear the post-cost breakeven.
       # Recalibrated 2026-08-20 on DEDUPED shadow data (fix 8f3a728 removed the
       # duplicate-exit inflation that had made min_samples=10 unreachable):
       # at 10 samples only 8 tokens in the pool were evaluable -> the gate
       # locked out ~333 tokens/day as SHADOW_MIRROR_INSUFFICIENT. Lowered to
       # min_samples=3 with a 72h window (34 tokens qualify, 4.25x) while
       # MIN_AVG_PCT stays at 1.5 (>= post-cost breakeven; qualifying averages
       # cluster well above it, so no safe token is lost).
       - CHIMERA_SELECTION__MIRROR_GATE_ENABLED=true
       - CHIMERA_SELECTION__MIRROR_GATE_MIN_AVG_PCT=1.5
       - CHIMERA_SELECTION__MIRROR_GATE_MIN_SAMPLES=3
       - CHIMERA_SELECTION__MIRROR_GATE_WINDOW_HOURS=72
       # Wallet profitability gate (2026-08-07): only wallets with
       # statistically significant shadow PnL (t-stat > 1.645, >=10 samples,
       # 30d) are proven signal sources. Research: wallet selection is the
       # dominant copier-profitability factor (arxiv 2601.08641).
       - CHIMERA_SELECTION__WALLET_TSTAT_ENABLED=true
       - CHIMERA_SELECTION__WALLET_TSTAT_THRESHOLD=1.645
       - CHIMERA_SELECTION__WALLET_TSTAT_MIN_SAMPLES=10
       - CHIMERA_SELECTION__WALLET_TSTAT_WINDOW_DAYS=30
       # Token liquidity-velocity gate (2026-08-07): pump.fun curve tokens
       # only — require fast accumulation (>=0.10 SOL/trade) and reject the
       # late-curve dump zone (completion > 0.85). "Liquidity velocity is the
       # single most informative predictor of graduation" (arxiv 2602.14860).
       - CHIMERA_SELECTION__TOKEN_VELOCITY_GATE_ENABLED=true
       - CHIMERA_SELECTION__TOKEN_MIN_LIQUIDITY_VELOCITY=0.10
       - CHIMERA_SELECTION__TOKEN_MAX_CURVE_COMPLETION=0.85
       # Whale averaging-down gate (2026-08-08): reject BUYs when the signal
       # wallet has >= 2 prior buys on the token within 12h and its latest
       # buy is >= 3% below its first — the whale is catching a falling knife
       # (both 2026-08-08 big losers were 3rd-4th-cycle entries into -97% tokens).
       - CHIMERA_SELECTION__AVG_DOWN_ENABLED=true
       - CHIMERA_SELECTION__AVG_DOWN_WINDOW_HOURS=12
       - CHIMERA_SELECTION__AVG_DOWN_MIN_BUYS=2
       - CHIMERA_SELECTION__AVG_DOWN_MIN_DROP_PCT=3
       # Pump-chase gate (2026-08-08): reject BUYs on tokens up > 10% in 15m
       # unless multi-wallet consensus/cluster (entered DcdNm2UX at +15.6%/15m
       # — the pump top — and stopped out 2s later).
       - CHIMERA_SELECTION__PUMP_CHASE_ENABLED=true
       - CHIMERA_SELECTION__PUMP_CHASE_MAX_DELTA_PCT=10
       # Stop-loss re-entry cooldown (2026-08-08). Retuned 2026-08-22 (profit
       # fix Phase 4): 12h/5% let the churn class through — 72% of positions
       # were re-entries (141/197) with per-exit losses under 5% (EjD5Y9:
       # 3 entries, -0.22 SOL). Now ANY realized loss-exit (>=0.5%) blocks
       # that token for 24h; profitable exits never trigger it.
       - CHIMERA_SELECTION__SL_COOLDOWN_ENABLED=true
       - CHIMERA_SELECTION__SL_COOLDOWN_HOURS=24
       - CHIMERA_SELECTION__SL_COOLDOWN_LOSS_PCT=0.5
       # Entry drift guard (2026-08-22, profit fix Phase 3): reject BUYs when
       # the current price drifted >3% (EITHER direction) from the whale's
       # signal-time entry — re-admitted signals filled ~2-3% net worse than
       # the shadow mark by copying into matured pumps. Fails open when the
       # price/decimals are unknown (same fail-open as the pump-since-whale
       # guard it shares the unit-verified conversion with).
       - CHIMERA_SELECTION__ENTRY_DRIFT_GUARD_ENABLED=true
       - CHIMERA_SELECTION__MAX_ENTRY_DRIFT_PCT=3.0
        # Paper trading mode (simulated execution, no real SOL)
       - CHIMERA_TRADE_MODE=paper
        # Profitability verdict enforcement (Phase C): populate the verdict
        # cache so live entry BUYs can reach GO. In Live mode the SignalProcessor
        # fail-closes any non-GO verdict; Paper mode always proceeds so shadow
        # evidence keeps accumulating. See docs/profitability-gates.md.
       - CHIMERA_PROFITABILITY_GATE__ENABLED=true
       # Dune Analytics API key for wallet PnL monitoring
       - DUNE_API_KEY=${DUNE_API_KEY:-}
       # Shadow paper trader: close positions after 24h (was 168h default) so
       # the open-position set stays bounded — 10k+ open positions caused a
       # ~4.7k qps monitor loop that inflated postgres session memory
       - CHIMERA_SHADOW_MAX_LIFETIME_HOURS=${CHIMERA_SHADOW_MAX_LIFETIME_HOURS:-24}
    env_file:
      - .env
    depends_on:
      prometheus:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tor:
        condition: service_started
    networks:
      - chimera-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - devnet
      - mainnet-paper
      - mainnet-prod
      - evaluation

  # Dune bootstrap - one-shot wallet PnL history + roster seed. Not started
  # by `up`; run manually (note: /app is not on PATH, use the absolute path):
  #   dry-run:  docker compose run --rm bootstrap_dune /app/bootstrap_dune --dry-run
  #   real run: docker compose run --rm bootstrap_dune /app/bootstrap_dune --apply --roster
  bootstrap_dune:
    build:
      context: .
      dockerfile: operator/Dockerfile
      args:
        GIT_HASH: ${GIT_HASH:-unknown}
    container_name: chimera-bootstrap-dune
    restart: "no"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    environment:
      - RUST_LOG=info
      - CHIMERA_LOG_DIR=/app/data/logs
      - CHIMERA_DB_MODE=${CHIMERA_DB_MODE:-postgres}
      - DATABASE_URL=${DATABASE_URL:-postgresql://chimera:changeme_asap@postgres:5432/chimera}
      - DUNE_API_KEY=${DUNE_API_KEY:-}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chimera-network
    command: ["/app/bootstrap_dune", "--dry-run"]
    profiles:
      - mainnet-paper
      - mainnet-prod

  # Tor+privoxy sidecar — Jupiter stopgap (see HTTPS_PROXY on operator).
  # No host ports: only reachable on chimera-network. Remove when a valid
  # Jupiter API key is configured.
  tor:
    image: dockage/tor-privoxy:latest
    container_name: chimera-tor
    restart: unless-stopped
    networks:
      - chimera-network
    profiles:
      - devnet
      - mainnet-paper
      - mainnet-prod
      - evaluation

  # Chimera Scout - Wallet intelligence layer
  scout:
    build:
      context: .
      dockerfile: scout/Dockerfile
    container_name: chimera-scout
    restart: unless-stopped
    expose:
      - "8081"
    volumes:
      - ./data:/app/data
      - scout-data:/app/scout-data
      - ./scout:/app
    environment:
      - PYTHONUNBUFFERED=1
      # Logs go to the host-mounted ./data volume (never inside the container layer)
      - CHIMERA_LOG_DIR=/app/data/logs
      # DEBUG captures the per-wallet WQS component ledger + validator gate numbers
      - SCOUT_LOG_LEVEL=DEBUG
      # Fix Auto-Merge: Use operator container name
      - CHIMERA_API_URL=http://chimera-operator:8080
      - CHIMERA_OPERATOR_CONTAINER=chimera-operator
      # Helius API Key for wallet discovery
      - HELIUS_API_KEY=${HELIUS_API_KEY}
      # Birdeye API Key for historical liquidity (optional; set SCOUT_LIQUIDITY_MODE=real when provided)
      - BIRDEYE_API_KEY=${BIRDEYE_API_KEY:-}
      # Improved Discovery Configuration
      - SCOUT_MIN_TRADE_COUNT=1
      - SCOUT_MAX_WALLETS=250
      - SCOUT_DISCOVERY_HOURS=72
      # Deep scan capped at 7d (was 720h): 30-day scan hung on 2026-08-05
      # (started 00:56, never completed — scout stuck at 0% CPU all day,
      # blocking discovery + analysis). 7d is enough to find active traders
      # at a fraction of the API cost and hang risk.
      - SCOUT_DEEP_SCAN_HOURS=168
      - SCOUT_LIQUIDITY_MODE=${SCOUT_LIQUIDITY_MODE:-simulated}
      # Historical liquidity fallback: 'flexible' uses current liquidity with confidence
      # penalty when historical data is missing (instead of strict rejection)
      - SCOUT_STRICT_HISTORICAL_LIQUIDITY=flexible
      # Performance Optimization
      # Helius quota conservation (2026-08-13): the daily credit quota is
      # exhausted by combined scout analysis (~50k tx-fetches/cycle) + operator
      # webhook/RPC monitoring, halting all signal flow. Cut per-wallet tx fetch
      # (100->60) to stretch the quota. Was 100.
      - SCOUT_WALLET_TX_LIMIT=60
      - SCOUT_WALLET_TX_MAX_PAGES=15
      - SCOUT_DISCOVERY_MIN_SOL=0.1                              # Raised 0.05->0.1 to cut discovery volume + Helius burn
      - SCOUT_MIN_WALLET_AGE_DAYS=7                               # Filter out wallets < 7 days old
      - SCOUT_VALIDATE_WALLET_ACTIVITY=true                       # Require recent trades at discovery (filter dormant wallets)
      - SCOUT_ACTIVITY_RECENCY_HOURS=24                           # Discovered wallet must have >=1 trade in last 24h (was 48h — fresher wallets)
      # On-chain discovery OFF (2026-08-16): discovery burned ~498 credits
      # per run, ran ~every 10.5 min under the probe-cadence loop (122
      # runs/day ≈ 60K credits) and returned 0 new wallets every time — the
      # candidate pool already holds 10.9K wallets. Analysis, WQS scoring and
      # shadow promotion of existing candidates are unaffected. Re-enable
      # only with a per-day discovery budget once the plan supports it.
      - SCOUT_DISCOVERY_ENABLED=false
      # WQS Thresholds (relaxed for paper trading)
      - SCOUT_MIN_WQS_ACTIVE=15.0
      - SCOUT_MIN_WQS_CANDIDATE=10.0
      # Parse health exit threshold (lowered from 40 to reduce false cron alerts)
      - SCOUT_PARSE_HEALTH_EXIT_FAIL_PCT=25
      # Log token creation time API failures for diagnostics
      - SCOUT_VERBOSE=true
      # Confidence threshold for ACTIVE promotion (lowered for paper mode to expand wallet pool)
      - SCOUT_MIN_CONFIDENCE_ACTIVE=0.10
      # Re-validate existing CANDIDATE wallets each cycle (top 5 by WQS)
      - SCOUT_REVALIDATE_CANDIDATES=true
      - SCOUT_REVALIDATE_CANDIDATES_LIMIT=20
      # Validation gate parameters (all configurable)
      - SCOUT_FORBIDDEN_ARCHETYPES=SNIPER
      - SCOUT_MIN_CLOSE_RATIO=0.05
      - SCOUT_MIN_CLOSE_RATIO_SCALPER=0.05
      - SCOUT_MIN_CLOSE_RATIO_SWING=0.05
      - SCOUT_MIN_CLOSE_RATIO_WHALE=0.05
      - SCOUT_PROMOTION_MIN_TRADES=2
      - SCOUT_WALK_FORWARD_ENABLED=true
      - SCOUT_WALK_FORWARD_HOLDOUT_FRACTION=0.3
      - SCOUT_WALK_FORWARD_FALLBACK_PENALTY=2.0
      - SCOUT_MAX_REJECTION_RATE=0.5
      - SCOUT_MAX_PNL_REDUCTION_PCT=80.0
      - SCOUT_MAX_DRAWDOWN_FRACTION=0.5
      - SCOUT_MIN_AVG_HOLD_HOURS=2.0
      - SCOUT_ENFORCE_LOW_CHURN=true
      - SCOUT_MOMENTUM_BOOST=5.0
      # Fast-track promotion: WQS above this threshold with >=1 trade bypasses
      # close-count / walk-forward / backtest gates (RugCheck still enforced)
      - SCOUT_FAST_TRACK_WQS_THRESHOLD=80
      # Parse failure debug: completed data collection (2142 files captured)
      # Backtest cost calibration — match production Jito tip (default 0.0001 is 30x too low).
      # Production charges 0.0012-0.0055 SOL tips; 0.003 is the median observed tip.
      # Without this, the backtest approves wallets whose historical edge can't cover real costs.
      - SCOUT_JITO_TIP_SOL=0.003
      - SCOUT_PRIORITY_FEE_SOL=0.0001
      # Active tokens fall back to config/active_tokens.txt (100+ established tokens)
      # API Keys for validation (Loaded from env_file)
      # Database configuration
      - CHIMERA_DB_MODE=${CHIMERA_DB_MODE:-postgres}
      - DATABASE_URL=${DATABASE_URL:-postgresql://chimera:changeme_asap@postgres:5432/chimera}
      # Local SQLite fallback path (legacy code paths). Absolute + volume-mounted
      # so it's CWD-independent and writable (../data resolves to unwritable /data).
      - CHIMERA_DB_PATH=/app/data/chimera.db
      # DB connection pool sizing (psycopg3) — prevents "couldn't get a connection after 10s"
      - SCOUT_DB_POOL_MAX_SIZE=30
      - SCOUT_DB_POOL_TIMEOUT=15
      # Redis configuration
      - REDIS_ENABLED=${REDIS_ENABLED:-true}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      # Scout-specific Redis caching
      - SCOUT_CACHE_ENABLED=true
      - SCOUT_CACHE_TTL=3600
      - SCOUT_LIQUIDITY_CACHE_TTL=60
      # Paper trading mode
      - CHIMERA_TRADE_MODE=${CHIMERA_TRADE_MODE:-paper}
    env_file:
      - .env
    depends_on:
      operator:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
        - chimera-network
    # Run scout in continuous mode with 2-hour cycles (memecoin wallets go stale
    # fast; shorter cycles surface fresh active wallets sooner, refilling the
    # ACTIVE roster so the operator gets more signals).
    # Using --continuous keeps the Python process alive, so the Prometheus metrics
    # server (daemon thread) stays up between runs instead of dying when main.py exits.
    command: >
        sh -c "
          python main.py --continuous --continuous-interval 7200
        "
    profiles:
       - devnet
       - mainnet-paper
       - mainnet-prod
       - evaluation

  # Web Dashboard
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: chimera-web
    restart: unless-stopped
    expose:
      - "80"
    environment:
      - VITE_API_URL=http://localhost:8080
      - VITE_SOLANA_RPC=${SOLANA_RPC_URL:-https://api.devnet.solana.com}
    depends_on:
      - operator
    networks:
      - chimera-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    profiles:
      - devnet
      - mainnet-paper
      - mainnet-prod

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: chimera-prometheus
    restart: unless-stopped
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.external-url=https://chimera-01.moez.tech/prometheus'
      - '--web.route-prefix=/'
    networks:
      - chimera-network
    profiles:
      - devnet
      - mainnet-paper
      - mainnet-prod
      - evaluation

  # Grafana - Metrics visualization
  grafana:
    build:
      context: .
      dockerfile: docker/grafana/Dockerfile
    container_name: chimera-grafana
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./ops/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://chimera-01.moez.tech/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    depends_on:
      - prometheus
    networks:
      - chimera-network
    profiles:
      - devnet
      - mainnet-paper
      - mainnet-prod
      - evaluation

  # Alertmanager - Alert routing
  alertmanager:
    image: prom/alertmanager:latest
    container_name: chimera-alertmanager
    restart: unless-stopped
    volumes:
      - ./ops/alertmanager/config.yml:/etc/alertmanager/config.yml.template:ro
      - ./ops/alertmanager/entrypoint.sh:/entrypoint.sh:ro
      - alertmanager-data:/alertmanager
    env_file:
      - docker/env.${COMPOSE_PROFILE:-devnet}
      - docker/env.${COMPOSE_PROFILE:-devnet}.local
    command:
      - '--web.external-url=https://chimera-01.moez.tech/alerts'
      - '--web.route-prefix=/'
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    networks:
      - chimera-network
    profiles:
      - devnet
      - mainnet-paper
      - mainnet-prod

  # PostgreSQL Exporter - Metrics for Prometheus
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: chimera-postgres-exporter
    restart: unless-stopped
    environment:
       - "DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-chimera}:${POSTGRES_PASSWORD:-changeme_asap}@postgres:5432/${POSTGRES_DB:-chimera}?sslmode=disable"
    ports:
      - "127.0.0.1:9187:9187"
    networks:
      - chimera-network
    depends_on:
      - postgres
    profiles:
      - mainnet-paper
      - mainnet-prod

  # Node Exporter - System metrics for Prometheus
  node-exporter:
    image: prom/node-exporter:latest
    container_name: chimera-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    networks:
      - chimera-network
    profiles:
      - mainnet-paper
      - mainnet-prod
      - evaluation

volumes:
  alertmanager-data:
    driver: local
  grafana-data:
    driver: local
  prometheus-data:
    driver: local
  scout-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  chimera-network:
    name: chimera-network
    driver: bridge
