# Chimera Operator Configuration
# v1.0.1

server:
  host: "0.0.0.0"
  port: 8080
  request_timeout_ms: 30000

rpc:
  primary_provider: "helius"
  # Override via CHIMERA_RPC__PRIMARY_URL env var
  primary_url: "https://mainnet.helius-rpc.com/?api-key=${HELIUS_API_KEY}"
  # Override via CHIMERA_RPC__FALLBACK_URL env var
  fallback_url: "https://mainnet.helius-rpc.com/?api-key=${HELIUS_API_KEY}"
  rate_limit_per_second: 40
  timeout_ms: 2000
  max_consecutive_failures: 3
  functional_health_check: true   # Also probe getLatestBlockhash after getHealth to catch providers that return ok unconditionally

database:
  url: "postgresql://chimera:changeme_asap@postgres:5432/chimera"
  max_connections: 15

security:
  # Overridden by CHIMERA_SECURITY__WEBHOOK_SECRET
  webhook_secret: "${CHIMERA_SECURITY__WEBHOOK_SECRET}"
  max_timestamp_drift_secs: 60
  webhook_rate_limit: 100
  webhook_burst_size: 150
  # Admin wallets for API access
  admin_wallets:
    - address: "4nLqMGpdGoWT9kQZ4gWrGocT8HHbzvnwgRDU5pRuz62W"
      role: "admin"
  # API keys for automated scripts
  api_keys:
    - key: "dev-admin-key"
      role: "admin"

circuit_breakers:
  max_loss_24h_usd: 500
  max_consecutive_losses: 5
  max_drawdown_percent: 15
  cooldown_minutes: 30

strategy:
  # 60/40 split (2026-08-18). Heat ceiling is now 60% of capital
  # (position_sizing.portfolio_heat_percent) — raised 2026-08-20 so a single
  # 30%-of-capital position fits with room for concurrent exposure.
  shield_percent: 60
  spear_percent: 40
  # Executor hard ceiling (SOL). Raised 2026-08-20 to the absolute safety
  # ceiling so it does not reject the new capital-relative sizes; the effective
  # per-position cap is total_capital_sol * max_position_pct (min'd with 50).
  max_position_sol: 50.0
  min_position_sol: 0.01
  shield_signal_quality_threshold: 0.40  # Raised from 0.30: data shows only the 0.50+ quality band is gross-profitable (+0.06 SOL); 0.30-0.50 lost -0.53 SOL. 0.40 drops the worst sub-0.40 band (-0.37 SOL).
  spear_signal_quality_threshold: 0.40  # Raised from 0.30: same data — sub-0.40 signals are net-negative.
  dex_fee_rate: 0.003             # Default Raydium/Orca fee rate (0.3%)
  shield_max_total_cost_percent: 0.025  # Rejects Shield trades if costs exceed 2.5% of trade size (was 5%: too loose for a ~0% edge — 5% cost = guaranteed loss)
  spear_max_total_cost_percent: 0.03   # Rejects Spear trades if costs exceed 3% of trade size (was 8%: even with the 1.5x regime expansion that's 12% effective)
  slippage_fallback_small_percent: 0.005   # 0.5% slippage estimate for trades < threshold when Jupiter impact unavailable
  slippage_fallback_large_percent: 0.01    # 1.0% slippage estimate for trades >= threshold
  slippage_fallback_threshold_sol: 0.5     # SOL boundary between small/large for slippage fallback
  # REVERTED 2026-08-22 back to false. The Aug-19 flip failed its own
  # guardrail: live wallet_sell exits went negative everywhere (-1.55 SOL/48h
  # realized, -106.7/7d shadow) while mirror_main (targets [5.0] + trailing +
  # -8 hard stop) stayed positive in ALL windows (+8.3/48h, +17.0/7d, +224/all).
  # Live exits return to the profit_management rails below; those exit params
  # are intentionally untouched (price-path marks show dips recover: +3.05%
  # avg recovery vs -1.73% max drawdown).
  copy_wallet_sells: false

jito:
  enabled: true  # Overridden by CHIMERA_JITO__ENABLED env var for mainnet-paper
  searcher_endpoint: "https://tokyo.mainnet.block-engine.jito.wtf"  # Only region reachable from prod server (global/ny/amsterdam/frankfurt time out)
  tip_floor_sol: 0.0001
  tip_ceiling_sol: 0.0003
  tip_percentile: 50
  tip_percent_max: 0.03

jupiter:
  api_url: "https://api.jup.ag/swap/v2"  # Swap API v2 with RTSE, Jupiter Beam, and gasless (migrated from lite-api.jup.ag)
  # Jupiter API key — sent as x-api-key on all Jupiter requests. Required in Live
  # trade mode (keyless access is being phased out; legacy rate limits expire 2026-06-30).
  # Set via env: CHIMERA_JUPITER__API_KEY (not stored in this file).
  # Use the Meta-Aggregator (/order) for best price with managed landing.
  use_swap_v2: true  # Enabled for production (validated on devnet)
  enable_rtse: true  # Real-Time Slippage Estimation for market-aware slippage
  multi_dex_comparison: true  # Compare per-DEX routes for best pricing
  # Optional: exclude specific routers or DEXes
  # exclude_routers: "jupiterz"  # Exclude RFQ router if needed
  # exclude_dexes: "Raydium"  # Exclude specific DEX from Metis router
  # devnet_simulation_mode: Set via CHIMERA_JUPITER__DEVNET_SIMULATION_MODE env var

queue:
  capacity: 1000
  load_shed_threshold_percent: 80

token_safety:
  # Known safe tokens (allowed to have freeze/mint authority)
  freeze_authority_whitelist:
    - "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"  # USDC
    - "Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB"  # USDT
    - "So11111111111111111111111111111111111111112"   # Wrapped SOL
  mint_authority_whitelist:
    - "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"  # USDC
    - "Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB"  # USDT
    - "So11111111111111111111111111111111111111112"   # Wrapped SOL
  # Minimum liquidity thresholds (USD) - with 20% buffer for safety
  min_liquidity_shield_usd: 20000  # Shield floor: $20K (was $5K: 0.5 SOL buy on $5K pool = ~1.6% slippage; $20K keeps it under 0.5%)
  min_liquidity_spear_usd: 30000   # Spear floor: $30K (was $10K)
  min_liquidity_pumpfun_usd: 15000  # Pump.fun floor: $15K (was $5K; pump.fun blocked anyway but kept sane)
  # Enable honeypot detection via transaction simulation
  honeypot_detection_enabled: true
  # Holder-concentration gate (enabled 2026-08-07): reject tokens where the
  # top-10 non-DEX holders control >50% of supply — bundle-bot / manipulation
  # proxy (Nansen: "top 10 wallets hold over 50% supply → manipulation risk";
  # arxiv 2602.14860: bot-dominated tokens have systematically lower
  # graduation probability).
  holder_concentration_check_enabled: true
  max_holder_concentration_pct: 50.0
  # Token cache settings
  cache_capacity: 1000
  cache_ttl_seconds: 3600  # 1 hour
  # Minimum token age in hours to allow a BUY signal (0 disables the check)
  min_token_age_hours: 0.25        # 15min token age — paper experiment (was 0.5/30min): the shadow data shows the fresh-token edge (TOKEN_TOO_NEW = +239 SOL shadow) that the 30min floor filtered out. Loosened to 15min to measure whether that edge survives real execution. Still filters the <15min instant-rug zone. Revert if realized (post-cost) PnL is negative.
  min_token_age_pumpfun_hours: 0.25 # Same: 15min minimum for pump.fun tokens
  # Proven-wallet age waiver floor (2026-08-07): wallets with statistically
  # significant shadow PnL (t-stat > 1.645) trade early entries by design —
  # their signals are age-waived to 0.1h (6 min) instead of the 30 min global
  # minimum. Still filters instant rugs. 0 = disable the waiver.
  min_token_age_proven_hours: 0.1
  # Allow pump.fun tokens with real DEX liquidity (graduated). Bonding-curve
  # tokens stay blocked: they have $0 DEX liquidity and fail the $15K pumpfun
  # floor below. Positions exit on the copied wallet's SELL (copy_wallet_sells: true).
  # Re-enabled 2026-08-06 (was false since 70% of trades / 17% win rate / negative EV
  # — that data predates the $15K graduated liquidity floor).
  allow_graduated_pumpfun: true
  # ⚠️  SECURITY CRITICAL: NEVER enable this in production ⚠️
  # When false (default, SAFE), tokens not indexed by DexScreener are treated as $0 liquidity
  # and BUY signals are rejected (fail-closed security posture).
  # When true, uses a DANGEROUS supply-based heuristic that assumes high supply = high liquidity.
  # This creates an attack vector for honeypots and worthless tokens. Supply ≠ liquidity.
  # ENABLE AT YOUR OWN RISK - May lead to trading unsellable tokens and financial loss.
  # If you need to trade new tokens, wait for DexScreener indexing (usually within minutes).
  allow_unlisted_heuristic: false

# Notification settings
notifications:
  telegram:
    enabled: true
    # Set via environment: TELEGRAM_BOT_TOKEN
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    # Set via environment: TELEGRAM_CHAT_ID  
    chat_id: "${TELEGRAM_CHAT_ID}"
    rate_limit_seconds: 60
  rules:
    circuit_breaker_triggered: true
    wallet_drained: true
    position_exited: true
    wallet_promoted: true
    daily_summary: true
    rpc_fallback: true
  daily_summary:
    enabled: true
    hour_utc: 20  # 8 PM UTC
    minute: 0

# Monitoring configuration
monitoring:
  enabled: true
  helius_api_key: "${HELIUS_API_KEY}"
  helius_webhook_url: "https://chimera-01.moez.tech/api/v1/monitoring/helius-webhook"
  webhook_registration_batch_size: 10
  webhook_registration_delay_ms: 200
  webhook_processing_rate_limit: 45
  rpc_polling_enabled: true  # Keep as fallback
  rpc_poll_interval_secs: 8  # Legacy single interval (used if tiered_polling_enabled: false)
  rpc_poll_batch_size: 6
  rpc_poll_rate_limit: 40
  max_active_wallets: 50
  auto_demote_wallets: true  # Enable automatic wallet demotion based on copy performance
  inactivity_rotation_enabled: true  # Demote wallets that haven't traded recently
  auto_promote_enabled: true  # Refill ACTIVE roster from high-WQS CANDIDATEs (counterbalances auto-demote)
  auto_promote_min_wqs: 45.0  # Admit WQS>=45 wallets only (was 30: admitted low-quality wallets whose signals are negative-EV; the on-chain expectancy gate further filters)
  auto_promote_ttl_hours: 168  # 7-day TTL on auto-promoted wallets; auto-demote re-evaluates them
  auto_promote_max_age_days: 7  # Promote/demote by recency: candidates must have traded within 7d (was 14d: admitted stale wallets; fresh activity = current edge)
  wallet_boost_enabled: false  # Tiered per-wallet copy-performance sizing (opt-in; see docs/superpowers/specs/2026-08-03-wallet-performance-sizing-design.md)
  wallet_boost_min_sample: 15
  wallet_boost_window_trades: 20
  wallet_boost_window_days: 30
  wallet_boost_min_net_sol: 0.01
  wallet_boost_min_winrate: 0.40
  wallet_boost_recency_days: 7
  wallet_boost_size_sol: 0.50

  # Tiered inactivity thresholds: demote wallets with no recent trading activity
  inactivity_rotation:
    high_conviction_threshold_secs: 259200   # 3 days for WQS >= 80
    regular_conviction_threshold_secs: 172800 # 2 days for WQS 60-80
    low_conviction_threshold_secs: 86400      # 1 day for WQS < 60
    high_conviction_wqs_threshold: 80.0
    regular_conviction_wqs_threshold: 60.0
    max_oscillation_cycles: 3

  # Tiered polling based on wallet conviction level (enabled by default)
  # 2026-08-10: intervals raised 5/8/30s -> 30/60/120s. Polling every wallet
  # every 5s through the credit-metered Helius RPC burned the account's daily
  # quota in ~6h, which disabled webhooks + discovery (0 trades). Webhook-
  # registered wallets are also skipped by polling (see polling_task.rs).
  tiered_polling_enabled: true
  tiered_polling:
    high_conviction_interval_secs: 30     # WQS > 80: poll every 30 seconds
    regular_conviction_interval_secs: 60  # WQS 60-80: poll every 60 seconds
    emerging_conviction_interval_secs: 120 # WQS < 60 or CANDIDATE: poll every 120 seconds
    high_conviction_wqs_threshold: 80    # WQS threshold for high conviction
    regular_conviction_wqs_threshold: 60   # WQS threshold for regular conviction

  # Helius LaserStream WebSocket (zero-credit transaction parsing)
  # Disabled: the Developer plan does not include LaserStream access; the standard
  # mainnet.helius-rpc.com WSS endpoint is for Solana subscriptions, not LaserStream,
  # and connection attempts fail every 60s with no benefit. Rely on webhooks + RPC polling.
  use_websocket: false
  helius_websocket_url: "wss://mainnet.helius-rpc.com/?api-key=${HELIUS_API_KEY}"

  # WebSocket reconnection configuration
  websocket_reconnect:
    initial_backoff_secs: 1
    max_backoff_secs: 60
    backoff_multiplier: 2.0  # Exponential backoff
    max_attempts: 0  # 0 = infinite retries

  websocket_health_timeout_secs: 60  # Health check timeout
  websocket_commitment: "confirmed"  # Commitment level for subscriptions

  # Webhook lifecycle management
  webhook_lifecycle:
    auto_register_enabled: true    # Auto-register webhooks for promoted wallets
    auto_cleanup_enabled: true     # Auto-cleanup orphaned webhooks to prevent plan-limit exhaustion
    health_check_interval_secs: 21600 # Health check every 6h (was 1h — hourly per-wallet checks were burning the Helius daily quota)
    stale_threshold_days: 7       # Cleanup webhooks inactive for 7+ days
    max_registration_retries: 3   # Retry failed registrations up to 3 times
    helius_reconciliation_enabled: true  # Check Helius dashboard and clean up unprofitable webhooks
    helius_dry_run: false          # Actually delete orphaned webhooks (was: advisory mode)

# Profit management configuration
profit_management:
  targets: [5.0]               # Bank a third at +5% (floored by min_target_pct 5.0) — clears the ~1.4% cost breakeven; remainder trails
  tiered_exit_percent: 33      # Sell 33% of the remaining balance at each target (was 1 with empty targets)
  trailing_stop_activation: 2.5   # Activate trailing at +2.5% (was 5): 60% of shadow wins ended via 4h time_exit at +0.94% avg because the +5% activation never engaged on winners peaking in the 0-5% band
  trailing_stop_distance: 2     # Trail 2% below peak (was 3): capture more of the peak on small runners
  hard_stop_loss: -8              # Tightened from -25: cap tail risk, avg loser already exits ~-8%
  # Time-exit rails steered to 24h (2026-08-08, shadow A/B ledger): for
  # ADMITTED signals the fixed_24h rail avg'd +18.4% vs fixed_4h -6.8% and
  # fixed_1h -0.5% — the previous 4h rails were the LOSING rail. The -8%
  # stop loss still cuts real losers first; time exits are the backstop
  # for near-breakeven drift, and 24h captures the late-upside winners.
  time_exit_hours: 24          # Force-close after 24h (was 4h — losing rail)
  losing_time_exit_hours_shield: 24  # SHIELD losers time out at 24h (was 4h)
  losing_time_exit_hours_spear: 24
  wick_protection_secs: 60            # Widened from 30: give positions breathing room (2026-08-11)
  wick_protection_max_loss_percent: -5.0  # Widened from -3%: don't kill normal pump.fun volatility during grace
  recovery_gate_secs: 120           # Widened from 60: don't recovery-gate-exit during the 2-min breathing window
  recovery_gate_threshold: -5.0     # Widened from -2%: only exit on significant losses (>5%) at gate time
  # Selective recovery gate (Phase 2): below `recovery_gate_threshold` we no
  # longer blanket-cut. We cut immediately only when the loss is ALSO at/beyond
  # `recovery_gate_hard_threshold` (a genuine dump) or it stays below threshold
  # past `recovery_gate_max_secs`. Soft-band dips inside the window are held for
  # recovery, so temporary dips aren't prematurely realized.
  recovery_gate_hard_threshold: -7.0   # Genuine dump floor: cut immediately below this
  recovery_gate_max_secs: 300          # Longer re-evaluation window (5 min) for soft-band dips
  # Smart-exit realization guard (Phase 1): when a protective exit fires on the
  # price-CACHE reading but the LIVE sell fill is `exit_skew_pct` worse, defer up
  # to `defer_max_ticks` monitor ticks (~5s each) for a better fill. Catastrophic
  # losses (past the hard stop floor) and missing quotes never defer.
  exit_skew_pct: 5.0
  defer_max_ticks: 3
  pre_graduation_exit_enabled: true   # Phase 5: exit pump.fun curve tokens at >85% completion (dump zone)
  pre_graduation_exit_threshold: 0.85 # Before the graduation depth discontinuity
  # Per-wallet exit profiles: derive per-wallet time-exit hours + trailing
  # params from the wallet's on-chain round-trip behavior (median hold,
  # win/loss size), blended with the global values above via Bayesian
  # shrinkage (weight = samples/(samples+K)). Loss-side rails (stop loss,
  # recovery gate, wick) always stay global. Profiles persist from the
  # on-chain audit/promotion cycles — zero extra Helius cost.
  exit_profiles:
    enabled: true
    min_samples: 5          # below this many round trips -> global params unchanged
    shrinkage_k: 25         # K=25: 25 samples = 50% trust, 200 samples = 89%
    reference_hold_hours: 12  # wallet with median hold == 12h maps to multiplier 1.0
    hold_mult_min: 0.25     # clamp: fastest exits (4x shorter than global)
    hold_mult_max: 4.0      # clamp: longest holds (4x longer than global)
    trailing_min_distance_pct: 2.0
    trailing_max_distance_pct: 40.0
    trailing_min_activation_pct: 2.0
    trailing_max_activation_pct: 25.0
    refresh_secs: 600       # profile cache refresh interval

# Position sizing configuration
position_sizing:
  # Capital-relative sizing (2026-08-20): position sizes are a % of
  # total_capital_sol so they scale automatically with capital (10/100/1000 SOL).
  # At 10 SOL: base 0.75 / proven 1.5 / per-position cap 3.0 (Shield), 2.5 (Spear).
  # base halved 2026-08-22 — see base_size_pct below.
  base_size_sol: 0.75        # Legacy absolute base (retained for back-compat; sizing uses base_size_pct)
  # Halved 2026-08-22 (profitability fix Phase 1): ≥1 SOL entries averaged
  # -2.12% vs +0.79% for <0.5 SOL entries since capital-relative sizing landed.
  # Non-proven wallets now enter at half size (0.75 SOL @ 10 SOL capital);
  # proven wallets keep the full 15% via proven_size_pct below.
  base_size_pct: 0.075       # Base position = 7.5% of total_capital_sol (halved from 15%)
  max_size_sol: 50.0         # Absolute safety ceiling on any single position (SOL)
  max_position_pct: 0.30     # Per-position cap = 30% of total_capital_sol
  shield_max_pct: 0.30       # Shield strategy cap = 30% of capital (>= max_position_pct)
  spear_max_pct: 0.25        # Spear strategy cap = 25% of capital
  proven_size_pct: 0.15      # Proven-wallet fixed size = 15% of capital
  min_size_sol: 0.25         # Absolute floor (paper): sizes below this reject (skip-below-min)
  # Portfolio heat ceiling as a fraction of capital (2026-08-20). Raised from
  # the historical 20%/30% so a single 30%-of-capital position fits with room
  # for concurrent exposure (~50-60% of capital). Keep max_concurrent_positions=12.
  portfolio_heat_percent: 0.60
  # Proven (waived) wallets route to SPEAR (WQS-floor quality scoring clears
  # SPEAR's threshold, not SHIELD's) — the pct-based proven size fits under the
  # strategy cap at the configured capital. Unproven Spear flow is already
  # bounded by the WQS chain, spear_lite cap, and skip-below-min semantics.
  spear_max_size_sol: 1.0
  # Cost-ratio policy (2026-08-18): entries the sizer computes below
  # min_size_sol REJECT instead of clamping up — the fixed ~0.0006 SOL tip
  # load is 0.24% of 0.25 SOL but 2.4% of 0.025 SOL; marginal-conviction
  # sizes skip rather than trade at the minimum with the worst cost ratio.
  skip_below_min_size: true
  # Proven-wallet sizing (2026-08-18): wallets proven by deduped shadow stats
  # (t-stat/shadow-total oracle) size at a fixed fraction of capital — the WQS ×
  # confidence chain crushes them (WQS ~10, own-PnL score anti-correlated
  # with copy-PnL) to ~0.025 SOL, which skip semantics would reject. Atomic
  # with skip_below_min_size. Caps still applied: strategy max, spear_lite,
  # portfolio heat (NOT the conviction-size cap: its 0.25 history-less
  # default would re-clamp proven entries on fresh tokens).
  proven_sizing_boost: true
  proven_size_sol: 0.75
  min_live_position_sol: 0.02  # Minimum position size for live trading (distinct from paper)
  consensus_multiplier: 2.0  # Increased from 1.5x to 2.0x for stronger consensus signals
  max_concurrent_positions: 12  # Was 20: fewer simultaneous positions reduces exposure to negative-EV signals and churn costs
  use_kelly_sizing: false  # Fixed sizing at base_size for consistent cost ratios
  total_capital_sol: 10.0  # Total trading capital in SOL (adjust to actual wallet balance)
  off_hours_size_multiplier: 0.75  # Was 0.5; less penalization during off-hours for more trade volume
  # Phase 5 conviction-size cap: clamp to 75th percentile of the token's own
  # 7d entry sizes (fallback 0.25 SOL) — stay small and invisible, never the
  # "large entry" copy-traders pile onto as exit liquidity.
  conviction_size_cap_enabled: true
  conviction_size_default_cap_sol: 0.25

# MEV protection configuration
mev_protection:
  always_use_jito: true
  exit_tip_sol: 0.0005              # Reduced from 0.002: exits don't need high-priority landing (2026-08-11)
  consensus_tip_sol: 0.0005         # Reduced from 0.001
  standard_tip_sol: 0.0003          # Reduced from 0.0006

# Execution lock configuration for signal processing idempotency
execution_lock:
  enabled: true                    # Enable execution-level locking (prevents duplicate processing)
  lock_timeout_seconds: 120        # Lock timeout in seconds (auto-expiration for crash safety)
  cleanup_interval_seconds: 30    # Background cleanup interval in seconds

# Rejection-rate wallet mute: suppresses signal intake from wallets whose
# BUY signals are overwhelmingly rejected for structural reasons.
rejection_mute:
  enabled: true
  window_size: 50           # track last 50 BUY decisions per wallet
  min_window_samples: 20    # need >=20 decisions before muting
  hard_rejection_threshold: 0.90  # mute at >=90% hard-rejection rate
  mute_duration_hours: 6    # mute for 6h, then re-evaluate

# Token shadow blacklist: reject BUY signals for tokens whose shadow
# performance under our own exits is consistently negative.
# NOTE: mirror_main exits cut losers at -2% (recovery gate), so dump tokens
# average ~-2% to -3% — a -5% threshold never fires. -1.5% catches them.
shadow_blacklist:
  enabled: true
  min_samples: 10           # shadow exits (mirror_main, any wallet) required
  threshold_pct: -1.5       # avg shadow PnL% below this triggers the ban
  # cost_adjustment: shadow mirror PnL ignores trading costs (jito 0.48% +
  # dex fee 0.24% = ~0.72%/round trip at 0.5 SOL). Live PnL ≈ mirror − 0.72,
  # so gates add it back: token banned when mirror avg < -1.5 + 0.72 = -0.78
  # (live avg ≈ -1.5%). Measured on matched shadow/live signals 2026-08-05.
  cost_adjustment_pct: 0.72
  window_hours: 48

# Dune Analytics integration for wallet PnL monitoring
# API key read from DUNE_API_KEY env var
dune:
  enabled: true
  # Dune 24h-PnL demote-losers monitor. Disabled — redundant with shadow
  # quality demote + on-chain audit, and aggregate Dune PnL masks per-signal
  # losses. Re-enable only for investigation.
  demote_losers_enabled: false
  pnl_query_id: 8221776     # Dune query: 24h wallet PnL monitor (losers -> demote)
  # One-shot bootstrap (bootstrap_dune binary): per-wallet round-trip PnL
  # history (30d window) feeding the wallet t-stat / proven / cluster gates.
  # 0 = disabled. Created via the Dune API on 2026-08-07
  # (`bootstrap_dune --create-query`; reference SQL in
  # docs/operations/dune-bootstrap.md). 8256427 / 8256431 were superseded
  # iterations of the same query (left in the workspace, private).
  bootstrap_query_id: 8256459
  bootstrap_wallets_max: 60  # max distinct wallets per bootstrap run (credit bound)
  bootstrap_roster_enabled: true  # seed new wallets as CANDIDATE (never ACTIVE/REJECTED)
  check_interval_secs: 7200 # shadow quality demote cadence (local DB, 2h)
  # Dune promote + on-chain audit cadence. 1h (was 6h, 2026-08-07) so the
  # 55+ evidence-rich CANDIDATE wallets seeded by the bootstrap are assessed
  # and promoted within hours instead of days (Helius rate limit binds the
  # per-cycle assessment count, not the cadence).
  promote_check_interval_secs: 3600  # Dune promote + on-chain audit (1h)
  promote_enabled: true     # promote Dune-verified profitable CANDIDATE wallets
  promote_query_id: 8221520 # Dune query: top profitable traders (7d)
  promote_query_id_24h: 8235367 # Dune query: top profitable traders (24h active) — finds wallets trading RIGHT NOW, prioritized over 7d-only wallets
  promote_min_roi: 1.2      # min ROI (net PnL / buy volume) to promote
  promote_max_per_cycle: 10 # max promotions per hourly cycle
  # Cap on total ACTIVE wallets. Raised 60->90 (2026-08-07): the bootstrap
  # cohort adds up to 30 t-stat-passing wallets, and the promote cycle must
  # keep working through the remaining CANDIDATEs.
  promote_max_active_total: 90  # Dune-verified promotions take priority above auto-promote cap (50)
  # Wallets demoted within this window are ineligible for Dune promotion.
  # Prevents churn: shadow quality demotes on recent 48h signal PnL, Dune
  # re-promotes on historical 7d PnL (observed live: demote 15:32:44,
  # re-promote 15:33:37 on 2026-08-05).
  promote_demote_cooldown_hours: 24
  shadow_quality_enabled: true  # demote wallets with negative shadow PnL on admitted DEX signals
  shadow_quality_min_samples: 5 # min mirror_main exits before demoting
  shadow_quality_demote_threshold_pct: -1.5  # avg PnL% below this triggers demotion
  shadow_quality_cost_adjustment_pct: 0.72   # live PnL ≈ mirror − 0.72 (fees); see shadow_blacklist
  shadow_quality_window_hours: 48
  # On-chain wallet assessment: verify a candidate's ACTUAL round-trip
  # expectancy on Solana (Helius history) before admitting to live trading.
  # Dune aggregate PnL can hide negative per-trade expectancy.
  onchain_assessment:
    enabled: true
    min_round_trips: 10        # completed round trips required
    # Expectancy must clear our round-trip trading costs (~0.72%: jito 0.48%
    # + dex fee 0.24% at 0.5 SOL) plus a margin — a wallet at +0.5% expectancy
    # is net-negative to copy. Raised from 0.0 after shadow-vs-live analysis
    # (2026-08-05: shadow mirror -0.83% on admitted signals, live ~2% worse).
    min_expectancy_pct: 1.5    # avg round-trip PnL% must be > 1.5
    tx_limit: 200              # SWAP transactions fetched per wallet
    audit_actives_enabled: true  # retroactive audit: demote ACTIVE wallets without proven edge
    audit_max_per_cycle: 10    # ACTIVE wallets audited per cycle (API cost control)
