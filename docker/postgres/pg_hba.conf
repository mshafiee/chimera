# PostgreSQL Client Authentication Configuration
# Restricts access to the docker network only (2026-08-07 security fix):
# previously `host all all all trust` exposed the DB to the public internet
# (port 5432 was published on 0.0.0.0 and foreign IPs were connecting).

# TYPE  DATABASE  USER  ADDRESS          METHOD
local   all       all                     trust
host    all       all   127.0.0.1/32      trust
host    all       all   ::1/128           trust
# Docker bridge network (chimera-network = 172.18.0.0/16): operator, scout,
# exporter, and any compose-run containers.
host    all       all   172.18.0.0/16     trust
# Explicitly deny everything else (defense in depth behind the firewall).
host    all       all   all               reject
